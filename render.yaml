# Render Blueprint: the FastAPI backend on the free plan.
# The frontend deploys separately to Vercel (see frontend/vercel.json).
services:
  - type: web
    name: airinsight-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI # MongoDB Atlas connection string
        sync: false
      - key: MONGODB_DB
        value: airinsight
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "8"
      - key: ALLOW_ADMIN_SIGNUP # keep strangers from creating admin accounts
        value: "false"
      - key: ADMIN_PASSWORD # bootstrap admin, only used when seeding an empty database
        sync: false
      - key: CORS_ORIGINS # e.g. https://airinsight.vercel.app
        sync: false
      - key: GEMINI_API_KEY # primary AI for advisories and chat
        sync: false
      - key: GROQ_API_KEY # backup AI if Gemini fails or runs out of quota
        sync: false
